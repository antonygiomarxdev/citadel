[package]
name = "citadel-core"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
# ahash: 2-3x faster than std SipHash for non-cryptographic hashing.
# Used in BFS/DFS visited sets and traversal maps where keys (node IDs, edge kinds)
# are not attacker-controlled. Randomized seed provides HashDoS resistance.
# default-features disabled to avoid compile-time randomization overhead;
# runtime seed generation is sufficient for our use case.
ahash = { version = "0.8", default-features = false, features = ["std"] }
# regex-lite: lightweight regex for glob pattern matching in search filters.
# Chosen over the full regex crate to minimize compile times and binary size —
# we only need basic * and ** wildcards, not full regex syntax.
regex-lite = "0.1"
# rusqlite with bundled SQLite: embeds libsqlite3 so users don't need
# a system-installed version. The bundled feature adds ~1.5MB to the binary
# but guarantees ABI compatibility across platforms.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# tree-sitter: native Rust bindings (no WASM). Each grammar is a separate crate.
# We use tree-sitter 0.24+ which requires grammar crates to be built with
# tree-sitter 0.24+ as well. Grammars are compiled statically — no runtime
# grammar loading needed.
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
sha2 = "0.10"
