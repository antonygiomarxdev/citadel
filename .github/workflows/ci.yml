name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build napi binding
        run: npm run build:napi

      - name: Run Rust tests
        run: cargo test

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  napi-build:
    name: napi-build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build native binding
        run: npm run build:napi

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.arch }}
          path: dist/*.node

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Rust clippy
        run: cargo clippy --all -- -D warnings

      - name: Validate commit messages (Conventional Commits)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=100
            COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --oneline --format="%s")
          else
            COMMITS=$(git log -1 --oneline --format="%s")
          fi
          
          echo "Checking commits:"
          echo "$COMMITS"
          
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|release)(\([^)]+\))?!?: .+$"
          
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qiE "$REGEX"; then
              echo "ERROR: Invalid commit message '$msg'"
              echo "Commit messages must follow Conventional Commits specification (e.g., 'feat(parser): add support for Luau')."
              exit 1
            fi
          done <<< "$COMMITS"
